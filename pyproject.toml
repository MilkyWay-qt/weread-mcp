[project]
name = "weread-mcp"
version = "0.1.0"
description = "微信读书 MCP Server：把官方 weread-skills 转成基于 URL(SSE) 的 MCP 服务"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["mcp", "weread", "微信读书", "sse", "model-context-protocol"]
dependencies = [
    "mcp>=2.2.0",
    "httpx2>=2.5.0",
    "uvicorn>=0.31.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
weread-mcp = "weread_mcp.cli:main"

[project.urls]
"WeChatReading Skills" = "https://github.com/Tencent/WeChatReading"
"MCP Python SDK" = "https://github.com/modelcontextprotocol/python-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weread_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/weread_mcp/skills" = "weread_mcp/skills"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "trio>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
